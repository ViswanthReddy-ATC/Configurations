spring.datasource.url=jdbc:mysql://host.docker.internal:3306/employee
spring.datasource.username=root
spring.datasource.password=Viswanth18#

# Eureka Client Configuration
eureka.client.service-url.defaultZone=http://service-registry:8761/eureka/

# Eureka Instance Configuration
eureka.instance.hostname=employee-service
eureka.instance.prefer-ip-address=false
eureka.instance.non-secure-port=8082
eureka.instance.instance-id=${spring.application.name}:${eureka.instance.hostname}:${server.port}

# JPA Configuration
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
